apiVersion: apps/v1
kind: Deployment
metadata: {name: event-driven-ai-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: event-driven-ai-platform}}
 template:
  metadata: {labels: {app: event-driven-ai-platform}}
  spec:
   containers:
   - name: api
     image: event-driven-ai-platform:latest
     ports: [{containerPort: 8000}]
     readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
     livenessProbe: {httpGet: {path: /health/live, port: 8000}}
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
